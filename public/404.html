<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,follow">
  <title>Sayfa bulunamadı | NFCHane</title>
  <link rel="icon" href="/favicon.svg">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font: 1rem/1.65 system-ui, sans-serif; color: #19281e; background: #fafbf8; }
    main { max-width: 40rem; margin: 0 auto; padding: clamp(3rem, 12vh, 8rem) 1.5rem; }
    img { display: block; width: 8rem; height: auto; }
    h1 { font-size: clamp(2rem, 6vw, 3rem); line-height: 1.15; letter-spacing: -.04em; margin: 3rem 0 .75rem; }
    p { margin: 0 0 1.5rem; }
    nav { display: flex; align-items: center; flex-wrap: wrap; gap: .5rem 1.25rem; }
    a { color: #146344; font-weight: 650; }
    nav a { display: inline-flex; align-items: center; min-height: 44px; }
    nav a:first-child { color: white; background: #146344; padding: .7rem 1.2rem; border-radius: .55rem; text-decoration: none; }
    a:focus-visible { outline: 3px solid #267950; outline-offset: 4px; }
  </style>
</head>
<body>
  <main>
    <a href="/"><img src="/images/brand/nfchane-logo-black.svg" alt="NFCHane ana sayfa"></a>
    <h1>Sayfa bulunamadı.</h1>
    <p>Bağlantı eski veya eksik olabilir. Aradığınız kartı ürünler arasında bulabilirsiniz.</p>
    <nav aria-label="Devam seçenekleri"><a href="/#urunler">Kartları incele</a><a href="/bilgi/">Yardım ve bilgi</a></nav>
  </main>
</body>
</html>
